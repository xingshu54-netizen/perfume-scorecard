<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0C0D10" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0C0D10" />
  <meta name="color-scheme" content="dark" />
  <title>方案 B · 气味极光流光匣</title>
  <style>
    :root {
      --bg: #0C0D10;
      --surface: rgba(255, 255, 255, 0.055);
      --surface-hover: rgba(255, 255, 255, 0.09);
      --border: rgba(255, 255, 255, 0.11);
      --text: #F5F5F7;
      --text-sec: rgba(245, 245, 247, 0.68);
      --text-muted: rgba(245, 245, 247, 0.45);
      --aura: #C66B47;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
    }

    body {
      margin: 0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      padding-top: env(safe-area-inset-top, 0px);
    }

    /* 动态气味氛围极光层（仅用单支香水的植物色温柔和发光） */
    .ambient-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(circle at 50% 22%, color-mix(in srgb, var(--aura) 26%, transparent) 0%, transparent 62%);
      transition: background 360ms ease;
    }

    button, input {
      font-family: inherit;
    }

    button, [role="button"], .tappable {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      cursor: pointer;
    }

    input[type="text"] {
      font-size: 16px;
      color: var(--text);
    }

    .tabular { font-variant-numeric: tabular-nums; }

    /* 顶部栏 */
    .topbar {
      position: relative;
      z-index: 2;
      height: 50px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 8px;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .top-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .top-badge {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-sec);
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      padding: 2px 8px;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .pill-switch {
      display: inline-flex;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 999px;
      padding: 2px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .pill-btn {
      border: 0;
      background: transparent;
      color: var(--text-sec);
      font-size: 12px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 999px;
      transition: background-color 160ms var(--ease-out), color 160ms var(--ease-out), transform 120ms var(--ease-out);
    }

    .pill-btn.is-active {
      background: var(--text);
      color: #0C0D10;
      font-weight: 600;
    }

    .pill-btn:active { transform: scale(0.97); }

    .wish-pill {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      padding: 5px 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: transform 120ms var(--ease-out), background-color 140ms ease;
    }

    .wish-pill:active { transform: scale(0.97); }

    /* 主舞台 */
    .stage {
      position: relative;
      z-index: 1;
      flex: 1;
      min-height: 0;
    }

    .deck {
      height: 100%;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
    }

    .deck::-webkit-scrollbar { display: none; }
    .deck[hidden], .shelf-view[hidden] { display: none; }

    .slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      padding: 4px 16px calc(12px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
    }

    .glass-card {
      flex: 1;
      min-height: 0;
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.035) 100%);
      border: 1px solid var(--border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 16px 18px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    /* 上半区：居中瓶身光晕 + 标题 */
    .hero-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .card-meta-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .bottle-stage {
      position: relative;
      width: 120px;
      height: 108px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 2px 0 6px;
    }

    .bottle-halo {
      position: absolute;
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: var(--card-aura);
      opacity: 0.25;
      filter: blur(18px);
      pointer-events: none;
    }

    .bottle-stage .bottle-svg {
      position: relative;
      width: 92px;
      height: 106px;
      color: rgba(245, 245, 247, 0.92);
    }

    .perfume-brand {
      font-size: 12px;
      font-weight: 500;
      color: var(--card-aura);
      letter-spacing: 0.04em;
      margin-bottom: 2px;
    }

    .perfume-name {
      font-size: 23px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.025em;
      margin-bottom: 4px;
    }

    .perfume-spec {
      font-size: 11.5px;
      color: var(--text-sec);
      margin-bottom: 8px;
    }

    .qty-confirm-row {
      display: inline-flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .qty-chip {
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-sec);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 999px;
      transition: background-color 140ms ease, color 140ms ease, transform 120ms var(--ease-out);
    }

    .qty-chip.is-active {
      background: var(--card-aura);
      border-color: var(--card-aura);
      color: #0C0D10;
      font-weight: 600;
    }

    .qty-chip:active { transform: scale(0.97); }

    .poetic-text {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-sec);
      max-width: 34ch;
      margin: 0 auto 10px;
    }

    /* 三列极简香调矩阵（无嵌套卡片） */
    .pyramid-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 9px 0;
      gap: 8px;
      text-align: center;
    }

    .pyr-col {
      padding: 0 4px;
      border-right: 1px solid rgba(255, 255, 255, 0.07);
    }

    .pyr-col:last-child { border-right: 0; }

    .pyr-label {
      display: block;
      font-size: 10.5px;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    .pyr-val {
      display: block;
      font-size: 11.5px;
      line-height: 1.35;
      color: var(--text);
    }

    /* 流体极光滑动条打分 */
    .slider-block {
      padding-top: 10px;
    }

    .slider-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .slider-mood {
      font-size: 12.5px;
      color: var(--text-sec);
    }

    .slider-num {
      font-size: 30px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.03em;
      color: var(--card-aura);
    }

    .slider-num small {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      margin-left: 2px;
    }

    .glow-track {
      position: relative;
      height: 36px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.10);
      overflow: hidden;
      touch-action: none;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .glow-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      background: linear-gradient(90deg, color-mix(in srgb, var(--card-aura) 55%, transparent), var(--card-aura));
      border-radius: 999px;
      pointer-events: none;
      transition: width 70ms linear;
    }

    .glow-thumb {
      position: absolute;
      top: 4px;
      width: 26px;
      height: 26px;
      margin-left: -13px;
      border-radius: 50%;
      background: #FFFFFF;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      pointer-events: none;
      transition: left 70ms linear, opacity 140ms ease;
    }

    .glow-hints {
      display: flex;
      justify-content: space-between;
      font-size: 10.5px;
      color: var(--text-muted);
      padding: 4px 4px 0;
    }

    /* 三态快捷心意按钮 */
    .intent-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-top: 10px;
    }

    .intent-chip {
      height: 38px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-sec);
      font-size: 12.5px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background-color 160ms var(--ease-out), border-color 160ms ease, color 160ms ease, transform 120ms var(--ease-out);
    }

    .intent-chip.is-active {
      background: var(--card-aura);
      border-color: var(--card-aura);
      color: #0C0D10;
      font-weight: 600;
    }

    .intent-chip:active { transform: scale(0.97); }

    .glass-note-input {
      width: 100%;
      margin-top: 9px;
      height: 38px;
      border-radius: 11px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      background: rgba(0, 0, 0, 0.25);
      padding: 0 12px;
      outline: none;
      transition: border-color 160ms ease;
    }

    .glass-note-input:focus {
      border-color: var(--card-aura);
    }

    .glass-note-input::placeholder {
      color: var(--text-muted);
      font-size: 13px;
    }

    /* 底部滑块指示器 */
    .deck-footer {
      height: 36px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 2px 0;
    }

    .nav-arrow {
      border: 0;
      background: transparent;
      color: var(--text-sec);
      font-size: 12px;
      padding: 4px 6px;
      transition: opacity 140ms ease, transform 120ms var(--ease-out);
    }

    .nav-arrow:disabled { opacity: 0.25; cursor: default; }
    .nav-arrow:active:not(:disabled) { transform: scale(0.97); }

    .dot-strip {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      border: 0;
      padding: 0;
      background: rgba(255, 255, 255, 0.2);
      transition: width 180ms var(--ease-out), background-color 160ms ease;
    }

    .dot.is-active {
      width: 18px;
      background: var(--text);
    }

    .dot.is-tested:not(.is-active) {
      background: rgba(255, 255, 255, 0.55);
    }

    /* 陈列架双列总览 */
    .shelf-view {
      height: 100%;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 6px 16px calc(24px + env(safe-area-inset-bottom, 0px));
    }

    .shelf-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .shelf-card {
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.04);
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      color: var(--text);
      position: relative;
      transition: transform 140ms var(--ease-out), border-color 140ms ease;
    }

    .shelf-card:active { transform: scale(0.97); }

    .shelf-wish {
      position: absolute;
      top: 9px;
      right: 9px;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 999px;
      background: var(--card-aura);
      color: #0C0D10;
      font-weight: 600;
    }

    .shelf-card .bottle-svg {
      width: 56px;
      height: 68px;
      margin: 4px 0 6px;
      color: rgba(245, 245, 247, 0.9);
    }

    .shelf-brand {
      font-size: 10.5px;
      color: var(--card-aura);
    }

    .shelf-name {
      font-size: 13.5px;
      font-weight: 600;
      margin: 2px 0 4px;
    }

    .shelf-score {
      font-size: 12px;
      color: var(--text-sec);
    }

    /* 暗色磨砂抽屉 */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.56);
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms var(--ease-out);
    }

    .sheet-backdrop.is-open { opacity: 1; pointer-events: auto; }

    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 82dvh;
      max-width: 560px;
      margin: 0 auto;
      background: rgba(24, 25, 30, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px 24px 0 0;
      z-index: 61;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 320ms var(--ease-drawer);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .sheet.is-open { transform: translateY(0); }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .sheet-title {
      font-size: 17px;
      font-weight: 600;
      margin: 0;
    }

    .sheet-close {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 0;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .sheet-body {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 14px 18px;
    }

    .sheet-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 14px;
    }

    .sheet-foot {
      padding: 12px 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .copy-btn {
      width: 100%;
      height: 44px;
      border-radius: 999px;
      border: 0;
      background: var(--text);
      color: #0C0D10;
      font-size: 14px;
      font-weight: 600;
      transition: transform 120ms var(--ease-out);
    }

    .copy-btn:active { transform: scale(0.97); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 14px);
      background: rgba(245, 245, 247, 0.94);
      color: #0C0D10;
      font-size: 12.5px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      z-index: 80;
      transition: opacity 180ms var(--ease-out), transform 180ms var(--ease-out);
    }

    .toast.is-show { opacity: 1; transform: translate(-50%, 0); }

    @media (hover: hover) and (pointer: fine) {
      .shelf-card:hover { border-color: rgba(255, 255, 255, 0.25); }
      .wish-pill:hover { background: rgba(255, 255, 255, 0.12); }
    }
  </style>
</head>
<body>
  <div class="ambient-bg" id="ambient-bg" aria-hidden="true"></div>

  <header class="topbar">
    <div class="top-left">
      <span class="top-title">给你挑的十支香</span>
      <span class="top-badge tabular" id="top-progress">0/10</span>
    </div>
    <div class="top-right">
      <div class="pill-switch" role="tablist" aria-label="视图切换">
        <button type="button" class="pill-btn is-active" data-view="deck" role="tab" aria-selected="true">流光卡</button>
        <button type="button" class="pill-btn" data-view="shelf" role="tab" aria-selected="false">陈列架</button>
      </div>
      <button type="button" class="wish-pill" id="open-sheet-btn">
        <span class="tabular" id="wish-count">心愿 0</span>
      </button>
    </div>
  </header>

  <main class="stage">
    <div class="deck" id="deck-view"></div>
    <div class="shelf-view" id="shelf-view" hidden></div>
  </main>

  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <section class="sheet" id="wish-sheet" role="dialog" aria-modal="true" aria-label="心动正装榜">
    <header class="sheet-head">
      <h2 class="sheet-title">心动排行榜与心愿单</h2>
      <button type="button" class="sheet-close" id="close-sheet-btn" aria-label="关闭">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6 6 18M6 6l12 12" /></svg>
      </button>
    </header>
    <div class="sheet-body" id="sheet-body"></div>
    <footer class="sheet-foot">
      <button type="button" class="copy-btn" id="copy-report-btn">一键复制心愿榜发给男朋友</button>
    </footer>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../scripts/data.js"></script>
  <script src="./scent-meta.js"></script>
  <script>
    (function () {
      "use strict";
      var S = window.SCENT_STUDIO;
      var items = S.getMergedItems();
      var state = S.loadState();
      var currentView = "deck";
      var currentIndex = 0;
      var toastTimer = null;

      var ambientEl = document.getElementById("ambient-bg");
      var deckEl = document.getElementById("deck-view");
      var shelfEl = document.getElementById("shelf-view");
      var topProgressEl = document.getElementById("top-progress");
      var wishCountEl = document.getElementById("wish-count");
      var sheetEl = document.getElementById("wish-sheet");
      var backdropEl = document.getElementById("sheet-backdrop");
      var sheetBodyEl = document.getElementById("sheet-body");
      var toastEl = document.getElementById("toast");

      function setAmbientFor(idx) {
        var item = items[idx] || items[0];
        ambientEl.style.setProperty("--aura", item.palette.aura);
      }

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("is-show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove("is-show"); }, 2000);
      }

      function scoreToPct(score) {
        if (typeof score !== "number") return 0;
        return Math.max(0, Math.min(100, ((score - 1) / 9) * 100));
      }

      function renderDeck() {
        deckEl.innerHTML = items.map(function (item, idx) {
          var r = S.getReview(state, item.id);
          var score = r.overallScore;
          var hasScore = typeof score === "number";
          var pct = scoreToPct(score);

          var qtyRow = item.isUncertain
            ? '<div class="qty-confirm-row" data-id="' + item.id + '">' +
                '<button type="button" class="qty-chip' + (r.confirmedQuantity === 1 ? " is-active" : "") + '" data-qty="1">确认 ×1</button>' +
                '<button type="button" class="qty-chip' + (r.confirmedQuantity === 2 ? " is-active" : "") + '" data-qty="2">确认 ×2</button>' +
              "</div>"
            : "";

          var dotsHtml = items.map(function (it, dIdx) {
            var dr = S.getReview(state, it.id);
            var cls = "dot" + (dIdx === idx ? " is-active" : "") + (typeof dr.overallScore === "number" ? " is-tested" : "");
            return '<button type="button" class="' + cls + '" data-jump="' + dIdx + '" aria-label="第 ' + (dIdx + 1) + ' 支"></button>';
          }).join("");

          var intents = [
            { key: "retest", label: "再闻闻" },
            { key: "neutral", label: "还不错" },
            { key: "must_buy", label: "想要正装" }
          ].map(function (opt) {
            var active = r.buyIntent === opt.key;
            return '<button type="button" class="intent-chip' + (active ? " is-active" : "") + '" data-intent="' + opt.key + '" data-id="' + item.id + '">' + opt.label + "</button>";
          }).join("");

          return (
            '<article class="slide" data-index="' + idx + '" data-id="' + item.id + '" style="--card-aura:' + item.palette.aura + '">' +
              '<div class="glass-card">' +
                '<div class="hero-center">' +
                  '<div class="card-meta-row tabular">' +
                    "<span>" + item.indexLabel + " / 10</span>" +
                    "<span>" + S.escapeHtml(item.scentFamily) + "</span>" +
                  "</div>" +
                  '<div class="bottle-stage">' +
                    '<div class="bottle-halo"></div>' +
                    S.renderBottleSvg(item.id, { stroke: "rgba(245,245,247,0.92)", tint: item.palette.aura, tintOpacity: 0.34 }) +
                  "</div>" +
                  '<div class="perfume-brand">' + S.escapeHtml(item.brandZh + " · " + item.brandEn) + "</div>" +
                  '<h2 class="perfume-name">' + S.escapeHtml(item.nameZh) + "</h2>" +
                  '<div class="perfume-spec tabular" data-spec-text>' + S.escapeHtml(S.formatSpecSummary(item, r.confirmedQuantity)) + "</div>" +
                  qtyRow +
                  '<p class="poetic-text">“' + S.escapeHtml(item.poetic) + '”</p>' +
                "</div>" +
                '<div class="pyramid-row">' +
                  '<div class="pyr-col"><span class="pyr-label">前调</span><span class="pyr-val">' + S.escapeHtml(item.notes.top) + "</span></div>" +
                  '<div class="pyr-col"><span class="pyr-label">中调</span><span class="pyr-val">' + S.escapeHtml(item.notes.heart) + "</span></div>" +
                  '<div class="pyr-col"><span class="pyr-label">后调</span><span class="pyr-val">' + S.escapeHtml(item.notes.base) + "</span></div>" +
                "</div>" +
                '<div class="slider-block">' +
                  '<div class="slider-header">' +
                    '<span class="slider-mood" data-mood>' + S.escapeHtml(S.scoreMood(score)) + "</span>" +
                    '<div class="slider-num tabular"><span data-score-val>' + S.formatScore(score) + "</span><small>/10</small></div>" +
                  "</div>" +
                  '<div class="glow-track" data-slider="' + item.id + '" role="slider" aria-label="极光打分滑条" aria-valuemin="1" aria-valuemax="10" aria-valuenow="' + (hasScore ? score : 0) + '">' +
                    '<div class="glow-fill" data-fill style="width:' + (hasScore ? pct : 0) + '%"></div>' +
                    '<div class="glow-thumb" data-thumb style="left:' + (hasScore ? Math.max(5, Math.min(95, pct)) : 5) + '%;opacity:' + (hasScore ? 1 : 0.4) + '"></div>' +
                  "</div>" +
                  '<div class="glow-hints tabular"><span>1 跳过</span><span>5 尚可</span><span>10 心动</span></div>' +
                  '<div class="intent-row">' + intents + "</div>" +
                  '<input type="text" class="glass-note-input" data-note="' + item.id + '" maxlength="120" value="' + S.escapeHtml(r.note || "") + '" placeholder="写下闻后印象，比如适合哪件衣服或心情…" />' +
                "</div>" +
              "</div>" +
              '<div class="deck-footer">' +
                '<button type="button" class="nav-arrow" data-step="-1"' + (idx === 0 ? " disabled" : "") + ">&lsaquo; 上一支</button>" +
                '<div class="dot-strip">' + dotsHtml + "</div>" +
                '<button type="button" class="nav-arrow" data-step="1"' + (idx === items.length - 1 ? " disabled" : "") + ">下一支 &rsaquo;</button>" +
              "</div>" +
            "</article>"
          );
        }).join("");

        bindSliders();
      }

      function renderShelf() {
        shelfEl.innerHTML =
          '<div class="shelf-grid">' +
          items.map(function (item, idx) {
            var r = S.getReview(state, item.id);
            var isWish = r.buyIntent === "must_buy";
            return (
              '<button type="button" class="shelf-card" data-jump="' + idx + '" style="--card-aura:' + item.palette.aura + '">' +
                (isWish ? '<span class="shelf-wish">想要正装</span>' : "") +
                S.renderBottleSvg(item.id, { stroke: "rgba(245,245,247,0.9)", tint: item.palette.aura, tintOpacity: 0.35 }) +
                '<span class="shelf-brand">' + S.escapeHtml(item.brandZh) + "</span>" +
                '<span class="shelf-name">' + S.escapeHtml(item.nameZh) + "</span>" +
                '<span class="shelf-score tabular">' + (typeof r.overallScore === "number" ? S.formatScore(r.overallScore) + " / 10" : S.formatCompactSpec(item, r.confirmedQuantity)) + "</span>" +
              "</button>"
            );
          }).join("") +
          "</div>";
      }

      function syncHeader() {
        var stats = S.computeStats(items, state);
        topProgressEl.textContent = stats.testedCount + "/10";
        wishCountEl.textContent = "心愿 " + stats.mustBuyCount;
      }

      function updateSlide(slide, review) {
        var score = review.overallScore;
        var hasScore = typeof score === "number";
        var pct = scoreToPct(score);
        slide.querySelector("[data-score-val]").textContent = S.formatScore(score);
        slide.querySelector("[data-mood]").textContent = S.scoreMood(score);
        slide.querySelector("[data-fill]").style.width = (hasScore ? pct : 0) + "%";
        var thumb = slide.querySelector("[data-thumb]");
        thumb.style.left = (hasScore ? Math.max(5, Math.min(95, pct)) : 5) + "%";
        thumb.style.opacity = hasScore ? "1" : "0.4";
        slide.querySelectorAll("[data-intent]").forEach(function (btn) {
          btn.classList.toggle("is-active", btn.getAttribute("data-intent") === review.buyIntent);
        });
      }

      function bindSliders() {
        deckEl.querySelectorAll("[data-slider]").forEach(function (track) {
          var id = track.getAttribute("data-slider");
          var slide = track.closest(".slide");

          function applyX(clientX) {
            var rect = track.getBoundingClientRect();
            var ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
            var snapped = Math.round((1 + ratio * 9) * 2) / 2;
            var r = S.updateReview(state, id, { overallScore: snapped });
            track.setAttribute("aria-valuenow", String(snapped));
            updateSlide(slide, r);
            syncHeader();
          }

          var down = false;
          track.addEventListener("pointerdown", function (e) {
            e.stopPropagation();
            down = true;
            if (track.setPointerCapture) track.setPointerCapture(e.pointerId);
            applyX(e.clientX);
          });
          track.addEventListener("pointermove", function (e) {
            if (!down) return;
            e.stopPropagation();
            applyX(e.clientX);
          });
          track.addEventListener("pointerup", function () { down = false; });
          track.addEventListener("pointercancel", function () { down = false; });
        });
      }

      function jumpTo(idx) {
        currentIndex = Math.max(0, Math.min(items.length - 1, idx));
        setAmbientFor(currentIndex);
        if (currentView !== "deck") switchView("deck");
        var w = deckEl.clientWidth || 390;
        deckEl.scrollTo({ left: currentIndex * w, behavior: "smooth" });
      }

      function switchView(view) {
        currentView = view;
        document.querySelectorAll("[data-view]").forEach(function (b) {
          var active = b.getAttribute("data-view") === view;
          b.classList.toggle("is-active", active);
          b.setAttribute("aria-selected", active ? "true" : "false");
        });
        if (view === "shelf") {
          renderShelf();
          deckEl.hidden = true;
          shelfEl.hidden = false;
        } else {
          renderDeck();
          shelfEl.hidden = true;
          deckEl.hidden = false;
          deckEl.scrollLeft = currentIndex * (deckEl.clientWidth || 390);
          setAmbientFor(currentIndex);
        }
      }

      function renderSheet() {
        var stats = S.computeStats(items, state);
        var html = '<div class="sheet-row" style="color:var(--text-sec)"><span>已试 ' + stats.testedCount + ' / 10 支 · 均分 ' + stats.avgText + '</span><strong>正装心愿 ' + stats.mustBuyCount + " 支</strong></div>";
        if (stats.top3.length) {
          html += stats.top3.map(function (entry, i) {
            var flag = entry.review.buyIntent === "must_buy" ? " · 正装锁定" : "";
            return '<div class="sheet-row"><span>TOP ' + (i + 1) + " · " + S.escapeHtml(entry.item.brandZh + " " + entry.item.nameZh) + flag + '</span><strong class="tabular" style="color:' + entry.item.palette.aura + '">' + S.formatScore(entry.review.overallScore) + " 分</strong></div>";
          }).join("");
        } else {
          html += '<div class="sheet-row" style="color:var(--text-muted)">滑动极光打分条后，这里会列出你的心动榜单。</div>';
        }
        sheetBodyEl.innerHTML = html;
      }

      document.querySelector(".top-right").addEventListener("click", function (e) {
        var b = e.target.closest("[data-view]");
        if (b) switchView(b.getAttribute("data-view"));
      });

      deckEl.addEventListener("click", function (e) {
        var intentBtn = e.target.closest("[data-intent]");
        if (intentBtn) {
          var id = intentBtn.getAttribute("data-id");
          var key = intentBtn.getAttribute("data-intent");
          var cur = S.getReview(state, id);
          var next = cur.buyIntent === key ? null : key;
          var r = S.updateReview(state, id, { buyIntent: next });
          updateSlide(intentBtn.closest(".slide"), r);
          syncHeader();
          if (next === "must_buy") showToast("已标记为最想收的正装");
          return;
        }

        var qtyBtn = e.target.closest("[data-qty]");
        if (qtyBtn) {
          var wrap = qtyBtn.closest("[data-id]");
          var qId = wrap.getAttribute("data-id");
          var q = Number(qtyBtn.getAttribute("data-qty"));
          var qr = S.updateReview(state, qId, { confirmedQuantity: q });
          var qItem = items.find(function (x) { return x.id === qId; });
          wrap.querySelectorAll("[data-qty]").forEach(function (b) {
            b.classList.toggle("is-active", Number(b.getAttribute("data-qty")) === q);
          });
          wrap.closest(".hero-center").querySelector("[data-spec-text]").textContent = S.formatSpecSummary(qItem, qr.confirmedQuantity);
          showToast("已确认实收 " + q + " 支");
          return;
        }

        var step = e.target.closest("[data-step]");
        if (step) {
          jumpTo(currentIndex + Number(step.getAttribute("data-step")));
          return;
        }

        var dot = e.target.closest("[data-jump]");
        if (dot) jumpTo(Number(dot.getAttribute("data-jump")));
      });

      deckEl.addEventListener("input", function (e) {
        var n = e.target.closest("[data-note]");
        if (n) S.updateReview(state, n.getAttribute("data-note"), { note: n.value });
      });

      deckEl.addEventListener("scroll", function () {
        var w = deckEl.clientWidth || 390;
        var nextIdx = Math.round(deckEl.scrollLeft / w);
        if (nextIdx !== currentIndex && nextIdx >= 0 && nextIdx < items.length) {
          currentIndex = nextIdx;
          setAmbientFor(currentIndex);
        }
      }, { passive: true });

      shelfEl.addEventListener("click", function (e) {
        var card = e.target.closest("[data-jump]");
        if (card) jumpTo(Number(card.getAttribute("data-jump")));
      });

      document.getElementById("open-sheet-btn").addEventListener("click", function () {
        renderSheet();
        backdropEl.classList.add("is-open");
        sheetEl.classList.add("is-open");
      });

      function closeSheet() {
        backdropEl.classList.remove("is-open");
        sheetEl.classList.remove("is-open");
      }

      document.getElementById("close-sheet-btn").addEventListener("click", closeSheet);
      backdropEl.addEventListener("click", closeSheet);

      document.getElementById("copy-report-btn").addEventListener("click", function () {
        S.copyText(S.buildWishlistText(items, state)).then(function () {
          showToast("已复制心愿榜，快发给男朋友吧");
        });
      });

      renderDeck();
      syncHeader();
      setAmbientFor(0);
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>试香打分卡 · 三套重构方案同屏对比</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100dvh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      background: #141413;
      color: #F4F3EF;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .toolbar {
      min-height: 54px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2A2A28;
      gap: 10px;
      flex-wrap: wrap;
      background: #181817;
    }

    .group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn {
      border: 1px solid #3A3A36;
      background: #20201E;
      color: #D6D4CE;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease, transform 120ms cubic-bezier(0.23, 1, 0.32, 1);
      touch-action: manipulation;
    }

    .btn:active { transform: scale(0.97); }

    .btn.active {
      background: #F4F3EF;
      color: #141413;
      border-color: #F4F3EF;
      font-weight: 600;
    }

    .btn-link {
      border-color: #4A4A44;
      color: #E7E5DE;
    }

    .stage {
      flex: 1;
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      background: #0D0D0C;
      overflow: hidden;
    }

    iframe {
      width: 390px;
      max-width: 100%;
      height: min(844px, 100%);
      border: 1px solid #2E2E2B;
      border-radius: 26px;
      background: #fff;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      transition: width 240ms cubic-bezier(0.23, 1, 0.32, 1), height 240ms cubic-bezier(0.23, 1, 0.32, 1), border-radius 240ms ease;
    }

    iframe.is-full {
      width: 100%;
      height: 100%;
      border-radius: 10px;
    }

    @media (hover: hover) and (pointer: fine) {
      .btn:hover:not(.active) { border-color: #6B6B63; color: #FFFFFF; }
    }

    @media (max-width: 520px) {
      .stage { padding: 0; }
      iframe, iframe.is-full {
        width: 100%;
        height: 100%;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      .viewport-group { display: none; }
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="group" id="concept-tabs">
      <button type="button" class="btn active" data-src="./concept-a.html">方案 A · 法式沙龙印签</button>
      <button type="button" class="btn" data-src="./concept-b.html">方案 B · 气味极光流光匣</button>
      <button type="button" class="btn" data-src="./concept-c.html">方案 C · 浪漫拍立得手账</button>
    </div>
    <div class="group">
      <div class="group viewport-group" id="viewport-tabs">
        <button type="button" class="btn active" data-mode="mobile">手机视口 (390px)</button>
        <button type="button" class="btn" data-mode="full">全宽</button>
      </div>
      <a class="btn btn-link" id="open-standalone" href="./concept-a.html" target="_blank" rel="noopener">独立打开当前方案</a>
    </div>
  </header>

  <main class="stage">
    <iframe id="preview" src="./concept-a.html" title="试香打分卡方案预览"></iframe>
  </main>

  <script>
    (function () {
      "use strict";
      var frame = document.getElementById("preview");
      var standalone = document.getElementById("open-standalone");

      document.getElementById("concept-tabs").addEventListener("click", function (e) {
        var btn = e.target.closest("button[data-src]");
        if (!btn) return;
        document.querySelectorAll("#concept-tabs .btn").forEach(function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        var src = btn.getAttribute("data-src");
        frame.src = src;
        standalone.href = src;
      });

      document.getElementById("viewport-tabs").addEventListener("click", function (e) {
        var btn = e.target.closest("button[data-mode]");
        if (!btn) return;
        document.querySelectorAll("#viewport-tabs .btn").forEach(function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        frame.classList.toggle("is-full", btn.getAttribute("data-mode") === "full");
      });
    })();
  </script>
</body>
</html>

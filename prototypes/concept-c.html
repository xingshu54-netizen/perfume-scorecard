<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5EEEE" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#F5EEEE" />
  <meta name="color-scheme" content="light" />
  <title>方案 C · 浪漫拍立得试香手账</title>
  <style>
    :root {
      --desk: #F5EEEE;
      --photo-white: #FFFFFF;
      --ink: #241D1E;
      --ink-sec: #685B5D;
      --ink-muted: #988A8C;
      --stamp: #B83B48;
      --stamp-soft: #FCEEEF;
      --line: #EBE2E2;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
      --serif: "Noto Serif SC", "Songti SC", "STSong", Georgia, serif;
      --sans: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
      background: var(--desk);
      color: var(--ink);
      font-family: var(--sans);
    }

    body {
      margin: 0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--desk);
      overflow: hidden;
      padding-top: env(safe-area-inset-top, 0px);
    }

    button, input { font-family: inherit; }

    button, [role="button"] {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      cursor: pointer;
    }

    input[type="text"] {
      font-size: 16px;
      color: var(--ink);
    }

    .tabular { font-variant-numeric: tabular-nums; }

    /* 顶部栏 */
    .topbar {
      height: 50px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 8px;
    }

    .top-brand {
      display: flex;
      align-items: baseline;
      gap: 7px;
      min-width: 0;
    }

    .top-title {
      font-family: var(--serif);
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      white-space: nowrap;
    }

    .top-progress {
      font-size: 11.5px;
      color: var(--stamp);
      font-weight: 600;
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .mode-switch {
      display: inline-flex;
      background: rgba(36, 29, 30, 0.06);
      border-radius: 999px;
      padding: 2px;
    }

    .mode-btn {
      border: 0;
      background: transparent;
      color: var(--ink-sec);
      font-size: 12px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 999px;
      transition: background-color 150ms var(--ease-out), color 150ms var(--ease-out), transform 120ms var(--ease-out);
    }

    .mode-btn.is-active {
      background: var(--photo-white);
      color: var(--ink);
      font-weight: 600;
      box-shadow: 0 1px 4px rgba(36, 29, 30, 0.08);
    }

    .mode-btn:active { transform: scale(0.97); }

    .wish-btn {
      border: 1px solid rgba(184, 59, 72, 0.35);
      background: var(--photo-white);
      color: var(--stamp);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      transition: transform 120ms var(--ease-out), background-color 140ms ease;
    }

    .wish-btn:active { transform: scale(0.97); }

    /* 主舞台 */
    .stage {
      flex: 1;
      min-height: 0;
    }

    .deck {
      height: 100%;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
    }

    .deck::-webkit-scrollbar { display: none; }
    .deck[hidden], .spread-view[hidden] { display: none; }

    .slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      padding: 4px 18px calc(10px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
    }

    /* 拍立得相纸 */
    .polaroid {
      flex: 1;
      min-height: 0;
      background: var(--photo-white);
      border-radius: 10px;
      padding: 12px 12px 14px;
      box-shadow: 0 12px 28px rgba(48, 22, 28, 0.09), 0 1px 3px rgba(48, 22, 28, 0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    /* 上半部：水彩相框 + 瓶身 + 红色印章 */
    .photo-window {
      position: relative;
      height: 232px;
      flex-shrink: 0;
      border-radius: 6px;
      background: radial-gradient(circle at 50% 44%, #FFFFFF 0%, var(--photo-wash) 78%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(36, 29, 30, 0.05);
    }

    .film-index {
      position: absolute;
      top: 10px;
      left: 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-sec);
      letter-spacing: 0.04em;
    }

    .film-family {
      position: absolute;
      bottom: 10px;
      left: 12px;
      font-size: 11px;
      color: var(--ink-sec);
    }

    .photo-window .bottle-svg {
      width: 116px;
      height: 138px;
      color: var(--ink);
    }

    /* 正装锁定印章 */
    .ink-seal {
      position: absolute;
      top: 12px;
      right: 12px;
      border: 2px solid var(--stamp);
      color: var(--stamp);
      background: rgba(255, 255, 255, 0.84);
      padding: 4px 8px;
      border-radius: 4px;
      font-family: var(--serif);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      transform: rotate(-9deg) scale(1.16);
      opacity: 0;
      pointer-events: none;
      transition: transform 220ms var(--ease-out), opacity 180ms var(--ease-out);
    }

    .ink-seal.is-stamped {
      opacity: 1;
      transform: rotate(-9deg) scale(1);
    }

    /* 下半部：白相纸留白排版 */
    .chin-body {
      padding: 14px 4px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      justify-content: space-evenly;
    }

    .title-block {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }

    .brand-kicker {
      font-size: 11.5px;
      color: var(--scent-accent, var(--stamp));
      font-weight: 600;
    }

    .spec-caption {
      font-size: 11px;
      color: var(--ink-muted);
      text-align: right;
    }

    .perfume-title {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 700;
      line-height: 1.18;
      color: var(--ink);
      margin-top: 2px;
    }

    .qty-confirm-row {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .qty-mini {
      border: 1px solid rgba(36, 29, 30, 0.18);
      background: #FAF7F7;
      color: var(--ink-sec);
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 999px;
      transition: background-color 140ms ease, color 140ms ease, transform 120ms var(--ease-out);
    }

    .qty-mini.is-active {
      background: var(--ink);
      border-color: var(--ink);
      color: #FFFFFF;
    }

    .qty-mini:active { transform: scale(0.97); }

    .poetic-caption {
      font-family: var(--serif);
      font-size: 13px;
      line-height: 1.5;
      color: var(--ink-sec);
    }

    .scent-strip {
      font-size: 11.5px;
      line-height: 1.45;
      color: var(--ink-muted);
      padding-top: 6px;
      border-top: 1px dashed var(--line);
    }

    /* 五颗心动半星/半心交互（1–10 分） */
    .heart-rating-box {
      padding: 8px 0 4px;
      border-top: 1px dashed var(--line);
    }

    .heart-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }

    .heart-mood {
      font-size: 12.5px;
      color: var(--ink-sec);
    }

    .heart-score-text {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 700;
      color: var(--stamp);
    }

    .heart-score-text small {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 400;
      color: var(--ink-muted);
    }

    .hearts-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 2px;
      touch-action: none;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .heart-slot {
      width: 48px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 140ms var(--ease-out);
    }

    .heart-slot:active { transform: scale(0.92); }

    .heart-slot svg {
      width: 34px;
      height: 34px;
      pointer-events: none;
    }

    /* 盖章按钮 + 横线手写感笔记 */
    .stamp-action-btn {
      width: 100%;
      height: 42px;
      border-radius: 8px;
      border: 1.5px solid var(--stamp);
      background: var(--photo-white);
      color: var(--stamp);
      font-size: 13.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 160ms var(--ease-out), color 160ms var(--ease-out), transform 120ms var(--ease-out);
    }

    .stamp-action-btn.is-stamped {
      background: var(--stamp);
      color: #FFFFFF;
    }

    .stamp-action-btn:active { transform: scale(0.97); }

    .ruled-note-input {
      width: 100%;
      border: 0;
      border-bottom: 1.5px solid var(--line);
      background: transparent;
      padding: 6px 2px 5px;
      outline: none;
      border-radius: 0;
      transition: border-color 140ms ease;
    }

    .ruled-note-input:focus { border-bottom-color: var(--stamp); }
    .ruled-note-input::placeholder { color: var(--ink-muted); font-size: 13px; }

    /* 底部翻页条 */
    .deck-pager {
      height: 36px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 6px;
    }

    .pager-nav {
      border: 0;
      background: transparent;
      color: var(--ink-sec);
      font-size: 12.5px;
      padding: 4px 6px;
      transition: opacity 140ms ease, transform 120ms var(--ease-out);
    }

    .pager-nav:disabled { opacity: 0.25; cursor: default; }
    .pager-nav:active:not(:disabled) { transform: scale(0.97); }

    .pager-dots {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .p-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      border: 0;
      padding: 0;
      background: rgba(36, 29, 30, 0.16);
      transition: transform 160ms var(--ease-out), background-color 160ms ease;
    }

    .p-dot.is-active {
      background: var(--stamp);
      transform: scale(1.35);
    }

    .p-dot.is-tested:not(.is-active) {
      background: rgba(36, 29, 30, 0.45);
    }

    /* 摊开看双列桌面拼贴 */
    .spread-view {
      height: 100%;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 8px 16px calc(24px + env(safe-area-inset-bottom, 0px));
    }

    .spread-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .mini-polaroid {
      border: 0;
      background: var(--photo-white);
      border-radius: 8px;
      padding: 8px 8px 10px;
      box-shadow: 0 6px 16px rgba(48, 22, 28, 0.08);
      display: flex;
      flex-direction: column;
      text-align: left;
      position: relative;
      transition: transform 150ms var(--ease-out);
    }

    .mini-polaroid:nth-child(odd) { transform: rotate(-0.8deg); }
    .mini-polaroid:nth-child(even) { transform: rotate(0.8deg); }
    .mini-polaroid:active { transform: scale(0.97); }

    .mini-window {
      height: 82px;
      border-radius: 4px;
      background: radial-gradient(circle at 50% 45%, #FFF 0%, var(--photo-wash) 80%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .mini-window .bottle-svg {
      width: 50px;
      height: 60px;
      color: var(--ink);
    }

    .mini-seal {
      position: absolute;
      top: 5px;
      right: 5px;
      font-size: 9px;
      font-weight: 700;
      color: var(--stamp);
      border: 1px solid var(--stamp);
      background: rgba(255, 255, 255, 0.9);
      padding: 1px 4px;
      border-radius: 2px;
      transform: rotate(-7deg);
    }

    .mini-name {
      font-family: var(--serif);
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink);
      margin-top: 7px;
    }

    .mini-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 11px;
      color: var(--ink-sec);
      margin-top: 3px;
    }

    /* 许愿单抽屉 */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(36, 29, 30, 0.42);
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms var(--ease-out);
    }

    .sheet-backdrop.is-open { opacity: 1; pointer-events: auto; }

    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 82dvh;
      max-width: 560px;
      margin: 0 auto;
      background: #FFFDFD;
      border-radius: 22px 22px 0 0;
      z-index: 61;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 320ms var(--ease-drawer);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .sheet.is-open { transform: translateY(0); }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--line);
    }

    .sheet-title {
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 700;
      margin: 0;
    }

    .sheet-close {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 0;
      background: var(--desk);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .sheet-body {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 14px 18px;
    }

    .sheet-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 10px 0;
      border-bottom: 1px dashed var(--line);
      font-size: 14px;
    }

    .sheet-foot {
      padding: 12px 18px;
      border-top: 1px solid var(--line);
    }

    .copy-btn {
      width: 100%;
      height: 44px;
      border-radius: 10px;
      border: 0;
      background: var(--stamp);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 600;
      transition: transform 120ms var(--ease-out);
    }

    .copy-btn:active { transform: scale(0.97); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 14px);
      background: var(--ink);
      color: #FFFFFF;
      font-size: 12.5px;
      padding: 8px 16px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      z-index: 80;
      transition: opacity 180ms var(--ease-out), transform 180ms var(--ease-out);
    }

    .toast.is-show { opacity: 1; transform: translate(-50%, 0); }

    @media (hover: hover) and (pointer: fine) {
      .mini-polaroid:hover { transform: translateY(-2px); }
      .wish-btn:hover { background: var(--stamp-soft); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="top-brand">
      <span class="top-title">给你的试香小礼</span>
      <span class="top-progress tabular" id="top-progress">0/10</span>
    </div>
    <div class="top-controls">
      <div class="mode-switch" role="tablist" aria-label="视图切换">
        <button type="button" class="mode-btn is-active" data-view="deck" role="tab" aria-selected="true">拍立得</button>
        <button type="button" class="mode-btn" data-view="spread" role="tab" aria-selected="false">摊开看</button>
      </div>
      <button type="button" class="wish-btn tabular" id="open-sheet-btn">许愿单 0</button>
    </div>
  </header>

  <main class="stage">
    <div class="deck" id="deck-view"></div>
    <div class="spread-view" id="spread-view" hidden></div>
  </main>

  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <section class="sheet" id="wish-sheet" role="dialog" aria-modal="true" aria-label="正装许愿单">
    <header class="sheet-head">
      <h2 class="sheet-title">挑出最喜欢的那瓶正装</h2>
      <button type="button" class="sheet-close" id="close-sheet-btn" aria-label="关闭">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6 6 18M6 6l12 12" /></svg>
      </button>
    </header>
    <div class="sheet-body" id="sheet-body"></div>
    <footer class="sheet-foot">
      <button type="button" class="copy-btn" id="copy-report-btn">复制给男朋友（就买这瓶）</button>
    </footer>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../scripts/data.js"></script>
  <script src="./scent-meta.js"></script>
  <script>
    (function () {
      "use strict";
      var S = window.SCENT_STUDIO;
      var items = S.getMergedItems();
      var state = S.loadState();
      var currentView = "deck";
      var currentIndex = 0;
      var toastTimer = null;

      var deckEl = document.getElementById("deck-view");
      var spreadEl = document.getElementById("spread-view");
      var topProgressEl = document.getElementById("top-progress");
      var openSheetBtn = document.getElementById("open-sheet-btn");
      var sheetEl = document.getElementById("wish-sheet");
      var backdropEl = document.getElementById("sheet-backdrop");
      var sheetBodyEl = document.getElementById("sheet-body");
      var toastEl = document.getElementById("toast");

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("is-show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove("is-show"); }, 2000);
      }

      /**
       * 生成 5 颗可半心填充的心动 SVG（1–10 分）
       */
      function renderHeartsHtml(id, score) {
        var val = typeof score === "number" ? score : 0;
        var html = "";
        for (var i = 1; i <= 5; i++) {
          var fullThreshold = i * 2;
          var halfThreshold = fullThreshold - 1;
          var fillState = val >= fullThreshold ? "full" : val >= halfThreshold ? "half" : "empty";
          var gid = "hclip-" + id + "-" + i;
          var d = "M12 20.5s-7.4-4.6-9.8-8.9A5.4 5.4 0 0 1 12 6.2a5.4 5.4 0 0 1 9.8 5.4C19.4 15.9 12 20.5 12 20.5z";
          var fillLayer = "";
          if (fillState === "full") {
            fillLayer = '<path d="' + d + '" fill="#B83B48"/>';
          } else if (fillState === "half") {
            fillLayer =
              '<defs><clipPath id="' + gid + '"><rect x="0" y="0" width="12" height="24"/></clipPath></defs>' +
              '<path d="' + d + '" fill="#B83B48" clip-path="url(#' + gid + ')"/>';
          }
          html +=
            '<span class="heart-slot" data-heart="' + i + '">' +
              '<svg viewBox="0 0 24 24" aria-hidden="true">' +
                fillLayer +
                '<path d="' + d + '" fill="none" stroke="' + (fillState === "empty" ? "#CBBDBE" : "#B83B48") + '" stroke-width="1.6"/>' +
              "</svg>" +
            "</span>";
        }
        return html;
      }

      function renderDeck() {
        deckEl.innerHTML = items.map(function (item, idx) {
          var r = S.getReview(state, item.id);
          var score = r.overallScore;
          var isStamped = r.buyIntent === "must_buy";

          var qtyRow = item.isUncertain
            ? '<div class="qty-confirm-row" data-id="' + item.id + '">' +
                '<button type="button" class="qty-mini' + (r.confirmedQuantity === 1 ? " is-active" : "") + '" data-qty="1">确认 ×1</button>' +
                '<button type="button" class="qty-mini' + (r.confirmedQuantity === 2 ? " is-active" : "") + '" data-qty="2">确认 ×2</button>' +
              "</div>"
            : "";

          var dotsHtml = items.map(function (it, dIdx) {
            var dr = S.getReview(state, it.id);
            var cls = "p-dot" + (dIdx === idx ? " is-active" : "") + (typeof dr.overallScore === "number" ? " is-tested" : "");
            return '<button type="button" class="' + cls + '" data-jump="' + dIdx + '" aria-label="第 ' + (dIdx + 1) + ' 支"></button>';
          }).join("");

          return (
            '<article class="slide" data-index="' + idx + '" data-id="' + item.id + '" style="--photo-wash:' + item.palette.soft + ';--scent-accent:' + item.palette.primary + '">' +
              '<div class="polaroid">' +
                '<div class="photo-window">' +
                  '<span class="film-index tabular">' + item.indexLabel + " / 10</span>" +
                  '<span class="film-family">' + S.escapeHtml(item.scentFamily) + "</span>" +
                  '<div class="ink-seal' + (isStamped ? " is-stamped" : "") + '" data-seal>正装锁定</div>' +
                  S.renderBottleSvg(item.id, { stroke: "#241D1E", tint: item.palette.aura, tintOpacity: 0.34 }) +
                "</div>" +
                '<div class="chin-body">' +
                  "<div>" +
                    '<div class="title-block">' +
                      '<span class="brand-kicker">' + S.escapeHtml(item.brandZh + " · " + item.brandEn) + "</span>" +
                      '<span class="spec-caption tabular" data-spec-text>' + S.escapeHtml(S.formatCompactSpec(item, r.confirmedQuantity)) + (item.isMerged ? "（跨单合并）" : "") + "</span>" +
                    "</div>" +
                    '<h2 class="perfume-title">' + S.escapeHtml(item.nameZh) + "</h2>" +
                    qtyRow +
                    '<p class="poetic-caption">“' + S.escapeHtml(item.poetic) + '”</p>' +
                    '<div class="scent-strip">前调 ' + S.escapeHtml(item.notes.top) + " · 中调 " + S.escapeHtml(item.notes.heart) + " · 后调 " + S.escapeHtml(item.notes.base) + "</div>" +
                  "</div>" +
                  "<div>" +
                    '<div class="heart-rating-box">' +
                      '<div class="heart-head">' +
                        '<span class="heart-mood" data-mood>' + S.escapeHtml(S.scoreMood(score)) + "</span>" +
                        '<span class="heart-score-text tabular"><span data-score-val>' + S.formatScore(score) + "</span><small> / 10</small></span>" +
                      "</div>" +
                      '<div class="hearts-bar" data-hearts="' + item.id + '" role="slider" aria-label="心动打分" aria-valuemin="1" aria-valuemax="10" aria-valuenow="' + (typeof score === "number" ? score : 0) + '">' +
                        renderHeartsHtml(item.id, score) +
                      "</div>" +
                    "</div>" +
                    '<button type="button" class="stamp-action-btn' + (isStamped ? " is-stamped" : "") + '" data-stamp="' + item.id + '">' +
                      '<svg width="14" height="14" viewBox="0 0 24 24" fill="' + (isStamped ? "currentColor" : "none") + '" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 21s-7-4.4-9.5-8.5A5.4 5.4 0 0 1 12 6.2a5.4 5.4 0 0 1 9.5 6.3C19 16.6 12 21 12 21z"/></svg>' +
                      "<span>" + (isStamped ? "已盖章：就想要这瓶正装" : "盖章：想要这瓶正装") + "</span>" +
                    "</button>" +
                    '<input type="text" class="ruled-note-input" data-note="' + item.id + '" maxlength="120" value="' + S.escapeHtml(r.note || "") + '" placeholder="写一句留给这支香的小纸条…" />' +
                  "</div>" +
                "</div>" +
              "</div>" +
              '<div class="deck-pager">' +
                '<button type="button" class="pager-nav" data-step="-1"' + (idx === 0 ? " disabled" : "") + ">&lsaquo; 上张</button>" +
                '<div class="pager-dots">' + dotsHtml + "</div>" +
                '<button type="button" class="pager-nav" data-step="1"' + (idx === items.length - 1 ? " disabled" : "") + ">下张 &rsaquo;</button>" +
              "</div>" +
            "</article>"
          );
        }).join("");

        bindHearts();
      }

      function renderSpread() {
        spreadEl.innerHTML =
          '<div class="spread-grid">' +
          items.map(function (item, idx) {
            var r = S.getReview(state, item.id);
            var isStamped = r.buyIntent === "must_buy";
            return (
              '<button type="button" class="mini-polaroid" data-jump="' + idx + '" style="--photo-wash:' + item.palette.soft + '">' +
                '<div class="mini-window">' +
                  (isStamped ? '<span class="mini-seal">正装锁定</span>' : "") +
                  S.renderBottleSvg(item.id, { stroke: "#241D1E", tint: item.palette.aura, tintOpacity: 0.34 }) +
                "</div>" +
                '<div class="mini-name">' + S.escapeHtml(item.brandZh + " " + item.nameZh) + "</div>" +
                '<div class="mini-meta tabular">' +
                  "<span>" + S.escapeHtml(S.formatCompactSpec(item, r.confirmedQuantity)) + "</span>" +
                  '<strong style="color:var(--stamp)">' + (typeof r.overallScore === "number" ? S.formatScore(r.overallScore) + "分" : "待试") + "</strong>" +
                "</div>" +
              "</button>"
            );
          }).join("") +
          "</div>";
      }

      function syncHeader() {
        var stats = S.computeStats(items, state);
        topProgressEl.textContent = stats.testedCount + "/10";
        openSheetBtn.textContent = "许愿单 " + stats.mustBuyCount;
      }

      function updateSlide(slide, id, r) {
        var score = r.overallScore;
        slide.querySelector("[data-score-val]").textContent = S.formatScore(score);
        slide.querySelector("[data-mood]").textContent = S.scoreMood(score);
        slide.querySelector("[data-hearts]").innerHTML = renderHeartsHtml(id, score);
        var stamped = r.buyIntent === "must_buy";
        slide.querySelector("[data-seal]").classList.toggle("is-stamped", stamped);
        var btn = slide.querySelector("[data-stamp]");
        btn.classList.toggle("is-stamped", stamped);
        btn.querySelector("span").textContent = stamped ? "已盖章：就想要这瓶正装" : "盖章：想要这瓶正装";
        btn.querySelector("svg").setAttribute("fill", stamped ? "currentColor" : "none");
      }

      function bindHearts() {
        deckEl.querySelectorAll("[data-hearts]").forEach(function (bar) {
          var id = bar.getAttribute("data-hearts");
          var slide = bar.closest(".slide");

          function applyClientX(clientX) {
            var rect = bar.getBoundingClientRect();
            var ratio = Math.max(0.05, Math.min(1, (clientX - rect.left) / rect.width));
            var score = Math.max(1, Math.min(10, Math.ceil(ratio * 10)));
            var r = S.updateReview(state, id, { overallScore: score });
            bar.setAttribute("aria-valuenow", String(score));
            updateSlide(slide, id, r);
            syncHeader();
          }

          var down = false;
          bar.addEventListener("pointerdown", function (e) {
            e.stopPropagation();
            down = true;
            if (bar.setPointerCapture) bar.setPointerCapture(e.pointerId);
            applyClientX(e.clientX);
          });
          bar.addEventListener("pointermove", function (e) {
            if (!down) return;
            e.stopPropagation();
            applyClientX(e.clientX);
          });
          bar.addEventListener("pointerup", function () { down = false; });
          bar.addEventListener("pointercancel", function () { down = false; });
        });
      }

      function jumpTo(idx) {
        currentIndex = Math.max(0, Math.min(items.length - 1, idx));
        if (currentView !== "deck") switchView("deck");
        var w = deckEl.clientWidth || 390;
        deckEl.scrollTo({ left: currentIndex * w, behavior: "smooth" });
      }

      function switchView(view) {
        currentView = view;
        document.querySelectorAll("[data-view]").forEach(function (b) {
          var active = b.getAttribute("data-view") === view;
          b.classList.toggle("is-active", active);
          b.setAttribute("aria-selected", active ? "true" : "false");
        });
        if (view === "spread") {
          renderSpread();
          deckEl.hidden = true;
          spreadEl.hidden = false;
        } else {
          renderDeck();
          spreadEl.hidden = true;
          deckEl.hidden = false;
          deckEl.scrollLeft = currentIndex * (deckEl.clientWidth || 390);
        }
      }

      function renderSheet() {
        var stats = S.computeStats(items, state);
        var html = '<div class="sheet-item" style="color:var(--ink-sec)"><span>已试 ' + stats.testedCount + ' / 10 支 · 均分 ' + stats.avgText + '</span><strong style="color:var(--stamp)">盖章锁定 ' + stats.mustBuyCount + " 瓶</strong></div>";
        if (stats.mustBuyList.length) {
          html += stats.mustBuyList.map(function (entry) {
            return '<div class="sheet-item"><span>[正装锁定] ' + S.escapeHtml(entry.item.brandZh + " " + entry.item.nameZh) + '</span><strong class="tabular">' + S.formatScore(entry.review.overallScore) + " 分</strong></div>";
          }).join("");
        } else {
          html += '<div class="sheet-item" style="color:var(--ink-muted)">还没有盖章的正装，看到喜欢的就拍下印章吧。</div>';
        }
        if (stats.top3.length) {
          html += '<div style="font-size:12px;color:var(--ink-muted);margin:14px 0 4px">最心动排行 Top 3</div>';
          html += stats.top3.map(function (entry, i) {
            return '<div class="sheet-item"><span>' + (i + 1) + ". " + S.escapeHtml(entry.item.brandZh + " " + entry.item.nameZh) + '</span><strong class="tabular">' + S.formatScore(entry.review.overallScore) + " 分</strong></div>";
          }).join("");
        }
        sheetBodyEl.innerHTML = html;
      }

      document.querySelector(".top-controls").addEventListener("click", function (e) {
        var b = e.target.closest("[data-view]");
        if (b) switchView(b.getAttribute("data-view"));
      });

      deckEl.addEventListener("click", function (e) {
        var stampBtn = e.target.closest("[data-stamp]");
        if (stampBtn) {
          var id = stampBtn.getAttribute("data-stamp");
          var cur = S.getReview(state, id);
          var next = cur.buyIntent === "must_buy" ? null : "must_buy";
          var r = S.updateReview(state, id, { buyIntent: next });
          updateSlide(stampBtn.closest(".slide"), id, r);
          syncHeader();
          showToast(next === "must_buy" ? "盖章成功！已加入正装许愿单" : "已取消这支印章");
          return;
        }

        var qtyBtn = e.target.closest("[data-qty]");
        if (qtyBtn) {
          var wrap = qtyBtn.closest("[data-id]");
          var qId = wrap.getAttribute("data-id");
          var q = Number(qtyBtn.getAttribute("data-qty"));
          var qr = S.updateReview(state, qId, { confirmedQuantity: q });
          var qItem = items.find(function (x) { return x.id === qId; });
          wrap.querySelectorAll("[data-qty]").forEach(function (b) {
            b.classList.toggle("is-active", Number(b.getAttribute("data-qty")) === q);
          });
          wrap.closest(".chin-body").querySelector("[data-spec-text]").textContent = S.formatCompactSpec(qItem, qr.confirmedQuantity);
          showToast("已确认实收 " + q + " 支");
          return;
        }

        var step = e.target.closest("[data-step]");
        if (step) {
          jumpTo(currentIndex + Number(step.getAttribute("data-step")));
          return;
        }

        var dot = e.target.closest("[data-jump]");
        if (dot) jumpTo(Number(dot.getAttribute("data-jump")));
      });

      deckEl.addEventListener("input", function (e) {
        var n = e.target.closest("[data-note]");
        if (n) S.updateReview(state, n.getAttribute("data-note"), { note: n.value });
      });

      deckEl.addEventListener("scroll", function () {
        var w = deckEl.clientWidth || 390;
        var nextIdx = Math.round(deckEl.scrollLeft / w);
        if (nextIdx !== currentIndex && nextIdx >= 0 && nextIdx < items.length) {
          currentIndex = nextIdx;
        }
      }, { passive: true });

      spreadEl.addEventListener("click", function (e) {
        var card = e.target.closest("[data-jump]");
        if (card) jumpTo(Number(card.getAttribute("data-jump")));
      });

      openSheetBtn.addEventListener("click", function () {
        renderSheet();
        backdropEl.classList.add("is-open");
        sheetEl.classList.add("is-open");
      });

      function closeSheet() {
        backdropEl.classList.remove("is-open");
        sheetEl.classList.remove("is-open");
      }

      document.getElementById("close-sheet-btn").addEventListener("click", closeSheet);
      backdropEl.addEventListener("click", closeSheet);

      document.getElementById("copy-report-btn").addEventListener("click", function () {
        S.copyText(S.buildWishlistText(items, state)).then(function () {
          showToast("许愿单已复制，快贴去微信发给他吧");
        });
      });

      renderDeck();
      syncHeader();
    })();
  </script>
</body>
</html>

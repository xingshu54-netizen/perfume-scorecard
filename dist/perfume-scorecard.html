<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FCFCFA" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#FCFCFA" />
  <meta name="color-scheme" content="light" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239E2A2B' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M9 3h6v3H9z'/%3E%3Cpath d='M10 6v3l-4.5 5.2A3 3 0 0 0 4.7 16.2V19a2 2 0 0 0 2 2h10.6a2 2 0 0 0 2-2v-2.8a3 3 0 0 0-.8-2L14 9V6'/%3E%3C/svg%3E" />
  <title>十支寻香签 — 给你的沙龙试香手账</title>
  <style>
/* ==========================================================================
   十支寻香签 — 法式沙龙配方印签 · 复古朱砂印泥版（Mobile-Native）
   ========================================================================== */

:root {
  --paper: #FCFCFA;
  --paper-tint: #F6F4EF;
  --ink: #141413;
  --ink-muted: #66635C;
  --ink-faint: #9B978E;
  --hairline: #E5E3DD;
  --hairline-strong: #C9C5BC;
  --vermilion: #9E2A2B;
  --vermilion-soft: #FBF1F1;

  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);

  --serif: "Noto Serif SC", "Songti SC", "STSong", Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
}

body {
  margin: 0;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--paper);
  overflow: hidden;
  padding-top: env(safe-area-inset-top, 0px);
}

button,
input,
textarea {
  font-family: inherit;
}

button,
[role="button"],
.tappable,
.link-action {
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  cursor: pointer;
}

input[type="text"] {
  font-size: 16px; /* 阻止 iOS Safari 聚焦页面放大 */
  color: var(--ink);
}

.tabular {
  font-variant-numeric: tabular-nums;
}

/* ==========================================================================
   顶部沙龙索引栏
   ========================================================================== */

.topbar {
  height: 50px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  border-bottom: 1px solid var(--hairline);
  background: var(--paper);
  gap: 8px;
}

.brand-lockup {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
}

.brand-title {
  font-family: var(--serif);
  font-size: 15.5px;
  font-weight: 700;
  letter-spacing: -0.02em;
  white-space: nowrap;
}

.brand-count {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-muted);
  letter-spacing: 0.04em;
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.seg-switch {
  display: inline-flex;
  border: 1px solid var(--ink);
  background: var(--paper);
}

.seg-btn {
  border: 0;
  background: transparent;
  color: var(--ink);
  font-size: 12px;
  font-weight: 500;
  padding: 5px 10px;
  transition: background-color 140ms var(--ease-out), color 140ms var(--ease-out), transform 120ms var(--ease-out);
}

.seg-btn.is-active {
  background: var(--ink);
  color: var(--paper);
}

.seg-btn:active {
  transform: scale(0.97);
}

.wish-trigger {
  border: 1px solid var(--hairline-strong);
  background: var(--paper);
  color: var(--vermilion);
  font-size: 12px;
  font-weight: 600;
  padding: 5px 10px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: transform 120ms var(--ease-out), border-color 140ms ease, background-color 140ms ease;
}

.wish-trigger:active {
  transform: scale(0.97);
}

/* ==========================================================================
   主舞台：单签横滑 / 目录总览
   ========================================================================== */

.stage {
  flex: 1;
  min-height: 0;
  min-width: 0;
  position: relative;
}

.deck {
  width: 100%;
  height: 100%;
  display: flex;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-x;
}

.deck::-webkit-scrollbar {
  display: none;
}

.deck[hidden],
.index-view[hidden] {
  display: none;
}

.slide {
  flex: 0 0 100%;
  width: 100%;
  height: 100%;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
}

/* 单支法式沙龙配方签 */
.label-sheet {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 8px;
  border: 1px solid var(--ink);
  background: var(--paper);
  position: relative;
  padding: 14px 18px 12px 15px;
  overflow-y: auto;
  overscroll-behavior: contain;
}

.label-edge {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: 4px;
  background: var(--scent-color, var(--ink));
}

/* 顶部信息与实拍瓶身 */
.label-head {
  display: grid;
  grid-template-columns: 1fr 98px;
  gap: 10px;
  align-items: start;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--hairline);
}

.label-num {
  font-family: var(--serif);
  font-size: 32px;
  line-height: 0.95;
  font-weight: 700;
  letter-spacing: -0.04em;
  color: var(--ink);
  margin-bottom: 6px;
}

.label-num span {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.06em;
  color: var(--ink-muted);
  margin-left: 5px;
  vertical-align: middle;
}

.label-brand {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 2px;
}

.label-title {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 700;
  line-height: 1.16;
  letter-spacing: -0.02em;
  color: var(--ink);
  margin: 0 0 2px;
}

.label-en {
  font-family: var(--serif);
  font-style: italic;
  font-size: 11.5px;
  color: var(--ink-muted);
  margin-bottom: 7px;
}

/* 外界口碑标签（克制排印词条） */
.rep-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.rep-tag {
  font-size: 10.5px;
  line-height: 1.25;
  color: var(--ink);
  border: 1px solid var(--hairline-strong);
  background: var(--paper-tint);
  padding: 2px 6px;
}

/* 实拍瓶身与朱砂正装印章 */
.bottle-stage {
  position: relative;
  width: 98px;
  height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.bottle-photo {
  max-width: 92px;
  max-height: 116px;
  width: auto;
  height: auto;
  object-fit: contain;
  display: block;
}

.vermilion-seal {
  position: absolute;
  right: -2px;
  bottom: 2px;
  border: 1.5px solid var(--vermilion);
  background: rgba(252, 252, 250, 0.92);
  padding: 2px;
  transform: rotate(-8deg) scale(1.14);
  opacity: 0;
  pointer-events: none;
  transition: transform 180ms var(--ease-out), opacity 160ms var(--ease-out);
}

.vermilion-seal-inner {
  border: 1px solid var(--vermilion);
  padding: 2px 5px;
  display: flex;
  flex-direction: column;
  align-items: center;
  color: var(--vermilion);
}

.vermilion-seal-inner span {
  font-family: var(--serif);
  font-size: 11px;
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: 0.04em;
  white-space: nowrap;
}

.vermilion-seal-inner small {
  font-family: var(--mono);
  font-size: 7.5px;
  letter-spacing: 0.1em;
  line-height: 1.1;
  margin-top: 1px;
}

.vermilion-seal.is-stamped {
  opacity: 1;
  transform: rotate(-8deg) scale(1);
}

/* 诗意句 */
.poetic-line {
  font-family: var(--serif);
  font-size: 13px;
  line-height: 1.5;
  color: #3D3B36;
  margin: 0;
  padding: 2px 0;
}

/* ==========================================================================
   零跳动「气味配方 | 穿香处方」clip-path 滑块 + 模糊叠化切换
   ========================================================================== */

.prescription-block {
  border-top: 1px solid var(--hairline);
  border-bottom: 1px solid var(--ink);
  padding-top: 8px;
}

.clip-tabs-wrap {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  border: 1px solid var(--ink);
  margin-bottom: 6px;
}

.clip-tabs-base {
  display: contents;
}

.clip-tab-btn {
  border: 0;
  background: transparent;
  color: var(--ink);
  font-size: 11.5px;
  font-weight: 600;
  padding: 5px 0;
  text-align: center;
  position: relative;
  z-index: 1;
  transition: transform 120ms var(--ease-out);
}

.clip-tab-btn:active {
  transform: scale(0.98);
}

.clip-tabs-active-layer {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: var(--ink);
  color: var(--paper);
  pointer-events: none;
  z-index: 2;
  clip-path: inset(0 50% 0 0);
  transition: clip-path 220ms var(--ease-in-out);
}

.clip-tabs-wrap[data-tab="usage"] .clip-tabs-active-layer {
  clip-path: inset(0 0 0 50%);
}

.clip-tab-mirror {
  font-size: 11.5px;
  font-weight: 600;
  padding: 5px 0;
  text-align: center;
}

.panel-swap-stage {
  position: relative;
  height: 98px;
  overflow: hidden;
}

.swap-panel {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  opacity: 0;
  filter: blur(2px);
  pointer-events: none;
  transition: opacity 180ms ease, filter 180ms ease;
}

.swap-panel.is-visible {
  opacity: 1;
  filter: blur(0);
  pointer-events: auto;
}

.info-row {
  display: grid;
  grid-template-columns: 40px 1fr;
  align-items: baseline;
  padding: 5px 0;
  border-bottom: 1px solid var(--hairline);
  font-size: 12px;
  line-height: 1.38;
}

.info-row:last-child {
  border-bottom: 0;
}

.info-key {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-muted);
}

.info-val {
  color: var(--ink);
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

/* ==========================================================================
   三维度人话短词细评
   ========================================================================== */

.subdims-block {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 2px 0;
}

.subdim-row {
  display: grid;
  grid-template-columns: 72px 1fr;
  align-items: center;
  gap: 6px;
}

.subdim-label {
  font-size: 11.5px;
  color: var(--ink-muted);
}

.subdim-opts {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
}

.dim-chip {
  border: 1px solid var(--hairline-strong);
  background: var(--paper);
  color: var(--ink);
  font-size: 11px;
  padding: 4px 2px;
  text-align: center;
  white-space: nowrap;
  transition: background-color 140ms var(--ease-out), color 140ms var(--ease-out), border-color 140ms ease, transform 120ms var(--ease-out);
}

.dim-chip.is-active {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
  font-weight: 600;
}

.dim-chip:active {
  transform: scale(0.97);
}

/* ==========================================================================
   复古朱砂五颗半心总评（1–10 分）
   ========================================================================== */

.hearts-section {
  border-top: 1px solid var(--hairline);
  padding-top: 8px;
}

.hearts-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 4px;
  gap: 8px;
}

.hearts-mood {
  font-size: 12px;
  color: var(--ink-muted);
}

.hearts-score {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 700;
  line-height: 1;
  color: var(--vermilion);
}

.hearts-score small {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 400;
  color: var(--ink-muted);
}

.hearts-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 2px 4px;
  touch-action: none;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}

.heart-slot {
  width: 48px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 120ms var(--ease-out);
}

.heart-slot:active {
  transform: scale(0.92);
}

.heart-slot svg {
  width: 30px;
  height: 30px;
  pointer-events: none;
}

/* ==========================================================================
   底部朱砂盖章按钮与随手记
   ========================================================================== */

.bottom-actions {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.stamp-btn {
  width: 100%;
  height: 40px;
  border: 1.5px solid var(--vermilion);
  background: var(--paper);
  color: var(--vermilion);
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  transition: background-color 160ms var(--ease-out), color 160ms var(--ease-out), transform 120ms var(--ease-out);
}

.stamp-btn.is-stamped {
  background: var(--vermilion);
  color: var(--paper);
}

.stamp-btn:active {
  transform: scale(0.97);
}

.note-line-input {
  width: 100%;
  border: 0;
  border-bottom: 1px solid var(--hairline-strong);
  background: transparent;
  padding: 5px 2px 4px;
  outline: none;
  border-radius: 0;
  transition: border-color 140ms ease;
}

.note-line-input:focus {
  border-bottom-color: var(--ink);
}

.note-line-input::placeholder {
  color: var(--ink-faint);
  font-size: 13px;
}

/* 翻签指示条 */
.deck-pager {
  height: 34px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 6px;
}

.pager-btn {
  border: 0;
  background: transparent;
  color: var(--ink);
  font-size: 12px;
  font-weight: 500;
  padding: 4px 2px;
  transition: opacity 140ms ease, transform 120ms var(--ease-out);
}

.pager-btn:disabled {
  opacity: 0.28;
  cursor: default;
}

.pager-btn:active:not(:disabled) {
  transform: scale(0.97);
}

.pager-dots {
  display: flex;
  align-items: center;
  gap: 5px;
}

.pager-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--hairline-strong);
  border: 0;
  padding: 0;
  transition: transform 160ms var(--ease-out), background-color 160ms ease;
}

.pager-dot.is-active {
  background: var(--vermilion);
  transform: scale(1.35);
}

.pager-dot.is-tested:not(.is-active) {
  background: var(--ink-muted);
}

/* ==========================================================================
   目录总览
   ========================================================================== */

.index-view {
  height: 100%;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 8px 16px calc(24px + env(safe-area-inset-bottom, 0px));
}

.index-intro {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 8px 0 10px;
  border-bottom: 1px solid var(--ink);
  font-size: 12px;
  color: var(--ink-muted);
}

.index-row {
  width: 100%;
  border: 0;
  border-bottom: 1px solid var(--hairline);
  background: transparent;
  padding: 11px 2px;
  display: grid;
  grid-template-columns: 44px 1fr auto;
  gap: 10px;
  align-items: center;
  text-align: left;
  transition: background-color 140ms ease, transform 120ms var(--ease-out);
}

.index-row:active {
  transform: scale(0.99);
  background: var(--paper-tint);
}

.index-thumb-wrap {
  width: 44px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.index-thumb {
  max-width: 42px;
  max-height: 50px;
  object-fit: contain;
}

.index-swatch {
  position: absolute;
  left: -4px;
  top: 8px;
  bottom: 8px;
  width: 2.5px;
}

.index-main {
  min-width: 0;
}

.index-title {
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 3px;
}

.index-tags {
  font-size: 11px;
  color: var(--ink-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.index-score {
  text-align: right;
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 700;
  color: var(--vermilion);
}

.index-wish-flag {
  display: block;
  font-family: var(--serif);
  font-size: 10px;
  border: 1px solid var(--vermilion);
  color: var(--vermilion);
  padding: 1px 4px;
  margin-top: 3px;
}

/* ==========================================================================
   心愿单抽屉与导出
   ========================================================================== */

.sheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(20, 20, 19, 0.42);
  z-index: 60;
  opacity: 0;
  pointer-events: none;
  transition: opacity 220ms var(--ease-out);
}

.sheet-backdrop.is-open {
  opacity: 1;
  pointer-events: auto;
}

.sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  max-height: 85dvh;
  max-width: 560px;
  margin: 0 auto;
  background: var(--paper);
  border-top: 1.5px solid var(--ink);
  z-index: 61;
  display: flex;
  flex-direction: column;
  transform: translateY(100%);
  transition: transform 320ms var(--ease-drawer);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

.sheet.is-open {
  transform: translateY(0);
}

.sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 18px;
  border-bottom: 1px solid var(--hairline);
}

.sheet-eyebrow {
  display: block;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--vermilion);
}

.sheet-title {
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 700;
  margin: 2px 0 0;
}

.sheet-close {
  width: 32px;
  height: 32px;
  border: 1px solid var(--hairline-strong);
  background: var(--paper);
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.sheet-body {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 14px 18px;
}

.sheet-kpis {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border: 1px solid var(--ink);
  margin-bottom: 14px;
}

.sheet-kpi {
  padding: 9px 6px;
  text-align: center;
  border-right: 1px solid var(--hairline);
}

.sheet-kpi:last-child {
  border-right: 0;
}

.sheet-kpi span {
  display: block;
  font-size: 11px;
  color: var(--ink-muted);
  margin-bottom: 2px;
}

.sheet-kpi strong {
  font-family: var(--serif);
  font-size: 19px;
}

.sheet-section-title {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-muted);
  letter-spacing: 0.04em;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--ink);
  margin: 12px 0 4px;
}

.sheet-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 9px 0;
  border-bottom: 1px solid var(--hairline);
  font-size: 13.5px;
}

.sheet-item > strong {
  white-space: nowrap;
  flex-shrink: 0;
}

.sheet-item-sub {
  display: block;
  font-size: 11px;
  color: var(--ink-muted);
  margin-top: 2px;
}

.png-preview-wrap {
  margin-top: 12px;
  border: 1px solid var(--hairline-strong);
  padding: 10px;
  background: var(--paper-tint);
}

.png-preview-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  margin-bottom: 8px;
}

.png-preview-head a {
  color: var(--vermilion);
  font-weight: 600;
  text-decoration: none;
  border-bottom: 1px solid var(--vermilion);
}

.png-preview-img {
  width: 100%;
  height: auto;
  display: block;
  border: 1px solid var(--hairline);
}

.sheet-foot {
  padding: 12px 18px;
  border-top: 1px solid var(--hairline);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.sheet-primary-actions {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 8px;
}

.btn-vermilion,
.btn-ink-outline {
  height: 42px;
  font-size: 13px;
  font-weight: 600;
  transition: transform 120ms var(--ease-out);
}

.btn-vermilion {
  border: 1px solid var(--vermilion);
  background: var(--vermilion);
  color: var(--paper);
}

.btn-ink-outline {
  border: 1px solid var(--ink);
  background: var(--paper);
  color: var(--ink);
}

.btn-vermilion:active,
.btn-ink-outline:active {
  transform: scale(0.97);
}

.sheet-secondary-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 2px;
}

.link-action {
  border: 0;
  background: transparent;
  color: var(--ink-muted);
  font-size: 12px;
  padding: 4px 2px;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.link-danger {
  color: var(--vermilion);
}

.reset-confirm-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--vermilion-soft);
  border: 1px solid var(--vermilion);
  padding: 8px 10px;
  font-size: 12px;
  color: var(--vermilion);
}

.reset-confirm-strip[hidden] {
  display: none;
}

.reset-confirm-btns {
  display: flex;
  gap: 6px;
}

.mini-cancel-btn,
.mini-danger-btn {
  padding: 4px 10px;
  font-size: 11.5px;
  border: 1px solid var(--ink);
  background: var(--paper);
  color: var(--ink);
}

.mini-danger-btn {
  border-color: var(--vermilion);
  background: var(--vermilion);
  color: var(--paper);
}

.toast {
  position: fixed;
  left: 50%;
  top: calc(58px + env(safe-area-inset-top, 0px));
  transform: translate(-50%, -10px);
  background: var(--ink);
  color: var(--paper);
  font-size: 12.5px;
  padding: 8px 15px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  z-index: 80;
  transition: opacity 240ms ease, transform 240ms var(--ease-out);
}

.toast.is-show {
  opacity: 1;
  transform: translate(-50%, 0);
}

@media (hover: hover) and (pointer: fine) {
  .index-row:hover {
    background: var(--paper-tint);
  }
  .wish-trigger:hover {
    border-color: var(--vermilion);
  }
  .stamp-btn:not(.is-stamped):hover {
    background: var(--vermilion-soft);
  }
}

@media (prefers-reduced-motion: reduce) {
  .clip-tabs-active-layer,
  .swap-panel,
  .vermilion-seal,
  .sheet,
  .sheet-backdrop,
  .toast {
    transition-duration: 0.01ms !important;
    filter: none !important;
    transform: none;
  }
}

  </style>
  
  
  
</head>

  <header class="topbar">

        <button type="button" class="seg-btn" data-view="index" data-testid="view-index-btn" role="tab" aria-selected="false">目录</button>

        </svg>
      </button>
    </header>
    <div class="sheet-body" id="sheet-body"></div>
    <footer class="sheet-foot">
      <div class="sheet-primary-actions">
        <button type="button" class="btn-vermilion" id="copy-report-btn" data-testid="copy-report-btn">复制文字发给男朋友</button>
        <button type="button" class="btn-ink-outline" id="export-png-btn" data-testid="export-png-btn">导出手账长图</button>
      </div>
      <div class="sheet-secondary-actions">
        <button type="button" class="link-action" id="export-json-btn">导出备份</button>
        <label class="link-action" for="import-json-input">
          <span>恢复备份</span>
          <input type="file" id="import-json-input" accept="application/json,.json" hidden />
        </label>
        <button type="button" class="link-action link-danger" id="ask-reset-btn">清空全部</button>
      </div>
      <div class="reset-confirm-strip" id="reset-confirm-strip" hidden>
        <span>清空本机全部打分与笔记？</span>
        <div class="reset-confirm-btns">
          <button type="button" class="mini-cancel-btn" id="cancel-reset-btn">取消</button>
          <button type="button" class="mini-danger-btn" id="confirm-reset-btn">确认清空</button>
        </div>
      </div>
    </footer>
  </section>

  <script>
/**
 * 十支寻香签 — 法式沙龙试香手账交互逻辑、持久化与战报长图导出
 */
(function () {
  "use strict";

  var STORAGE_KEY = "perfume_scorecard_v2";
  var LEGACY_KEY = "perfume_scorecard_v1";

  var CATALOG = Array.isArray(window.PERFUME_CATALOG) ? window.PERFUME_CATALOG : [];
  var BOTTLE_IMAGES = window.PERFUME_BOTTLE_IMAGES || {};

  var SUB_DIMENSIONS = [
    {
      key: "opening",
      label: "前调初印象",
      options: ["微冲", "顺鼻好闻", "一闻惊艳"]
    },
    {
      key: "drydown",
      label: "后调耐闻度",
      options: ["平淡", "越闻越爱", "上头贴肤"]
    },
    {
      key: "longevity",
      label: "留香持久度",
      options: ["偏短", "半天适中", "持香超久"]
    }
  ];

  var HEART_PATH =
    "M12 20.5s-7.4-4.6-9.8-8.9A5.4 5.4 0 0 1 12 6.2a5.4 5.4 0 0 1 9.8 5.4C19.4 15.9 12 20.5 12 20.5z";

  var state = loadState();
  var currentView = "deck";
  var currentIndex = 0;
  var activeTabs = {};
  var toastTimer = null;

  var deckEl = document.getElementById("deck-view");
  var indexEl = document.getElementById("index-view");
  var topProgressEl = document.getElementById("top-progress");
  var wishCountEl = document.getElementById("wish-count");
  var sheetEl = document.getElementById("wish-sheet");
  var backdropEl = document.getElementById("sheet-backdrop");
  var sheetBodyEl = document.getElementById("sheet-body");
  var resetStripEl = document.getElementById("reset-confirm-strip");
  var toastEl = document.getElementById("toast");

  function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function padIndex(n) {
    return n < 10 ? "0" + n : String(n);
  }

  function createEmptyReview(perfumeId) {
    return {
      perfumeId: perfumeId,
      overallScore: null,
      buyIntent: null,
      opening: null,
      drydown: null,
      longevity: null,
      note: "",
      updatedAt: null
    };
  }

  function loadState() {
    var base = { schemaVersion: "2.0.0", updatedAt: null, reviews: {} };
    try {
      var raw = window.localStorage ? window.localStorage.getItem(STORAGE_KEY) : null;
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object" && parsed.reviews) {
          return parsed;
        }
      }
      // 兼容迁移 v1 已记录的分数、正装心愿与笔记
      var legacyRaw = window.localStorage ? window.localStorage.getItem(LEGACY_KEY) : null;
      if (legacyRaw) {
        var legacy = JSON.parse(legacyRaw);
        if (legacy && typeof legacy === "object" && legacy.reviews) {
          Object.keys(legacy.reviews).forEach(function (pid) {
            var lr = legacy.reviews[pid];
            if (!lr) return;
            var r = createEmptyReview(pid);
            if (typeof lr.overallScore === "number") {
              r.overallScore = Math.max(1, Math.min(10, Math.round(lr.overallScore)));
            }
            if (lr.buyIntent === "must_buy") r.buyIntent = "must_buy";
            if (typeof lr.note === "string") r.note = lr.note;
            r.updatedAt = lr.updatedAt || null;
            base.reviews[pid] = r;
          });
          return base;
        }
      }
    } catch (e) {
      // 隐私模式或限制环境使用内存状态
    }
    return base;
  }

  function saveState() {
    state.updatedAt = new Date().toISOString();
    try {
      if (window.localStorage) {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }
    } catch (e) {
      // 忽略存储限制
    }
  }

  function getReview(id) {
    if (!state.reviews[id]) {
      state.reviews[id] = createEmptyReview(id);
    }
    return state.reviews[id];
  }

  function isItemTested(r) {
    return (
      typeof r.overallScore === "number" ||
      r.buyIntent === "must_buy" ||
      Boolean(r.opening || r.drydown || r.longevity) ||
      Boolean(r.note && r.note.trim())
    );
  }

  function updateReview(id, patch) {
    var r = getReview(id);
    Object.keys(patch).forEach(function (k) {
      r[k] = patch[k];
    });
    r.updatedAt = new Date().toISOString();
    saveState();
    return r;
  }

  function formatScore(score) {
    if (typeof score !== "number") return "--";
    return Number.isInteger(score) ? String(score) : score.toFixed(1);
  }

  function scoreMood(score) {
    if (typeof score !== "number") return "滑动或轻点爱心打分";
    if (score >= 9.5) return "本命香！好闻到想立刻收正装";
    if (score >= 8.5) return "超级心动，约会首选这一支";
    if (score >= 7.0) return "很喜欢，平时会常喷";
    if (score >= 5.0) return "还不错，看心情轮流穿";
    return "不太合拍，礼貌跳过这一支";
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("is-show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove("is-show");
    }, 2000);
  }

  function computeStats() {
    var tested = [];
    var scored = [];
    var mustBuy = [];
    var sum = 0;

    CATALOG.forEach(function (item) {
      var r = getReview(item.id);
      if (isItemTested(r)) tested.push({ item: item, review: r });
      if (typeof r.overallScore === "number") {
        scored.push({ item: item, review: r });
        sum += r.overallScore;
      }
      if (r.buyIntent === "must_buy") {
        mustBuy.push({ item: item, review: r });
      }
    });

    scored.sort(function (a, b) {
      var aMust = a.review.buyIntent === "must_buy" ? 1 : 0;
      var bMust = b.review.buyIntent === "must_buy" ? 1 : 0;
      if (b.review.overallScore !== a.review.overallScore) {
        return b.review.overallScore - a.review.overallScore;
      }
      if (bMust !== aMust) return bMust - aMust;
      return a.item.index - b.item.index;
    });

    return {
      testedCount: tested.length,
      scoredCount: scored.length,
      mustBuyCount: mustBuy.length,
      avgText: scored.length ? (sum / scored.length).toFixed(1) : "--",
      top3: scored.slice(0, 3),
      mustBuyList: mustBuy
    };
  }

  function renderHeartsHtml(id, score) {
    var val = typeof score === "number" ? score : 0;
    var html = "";
    for (var i = 1; i <= 5; i++) {
      var fullThreshold = i * 2;
      var halfThreshold = fullThreshold - 1;
      var fillState = val >= fullThreshold ? "full" : val >= halfThreshold ? "half" : "empty";
      var gid = "hclip-" + id + "-" + i;
      var fillLayer = "";
      if (fillState === "full") {
        fillLayer = '<path d="' + HEART_PATH + '" fill="#9E2A2B"/>';
      } else if (fillState === "half") {
        fillLayer =
          '<defs><clipPath id="' + gid + '"><rect x="0" y="0" width="12" height="24"/></clipPath></defs>' +
          '<path d="' + HEART_PATH + '" fill="#9E2A2B" clip-path="url(#' + gid + ')"/>';
      }
      var strokeColor = fillState === "empty" ? "#C9C5BC" : "#9E2A2B";
      html +=
        '<span class="heart-slot" data-heart="' + i + '">' +
          '<svg viewBox="0 0 24 24" aria-hidden="true">' +
            fillLayer +
            '<path d="' + HEART_PATH + '" fill="none" stroke="' + strokeColor + '" stroke-width="1.35"/>' +
          "</svg>" +
        "</span>";
    }
    return html;
  }

  function renderBottleImg(item, className) {
    var src = BOTTLE_IMAGES[item.id] || "";
    return (
      '<img class="' + className + '" src="' + src + '" alt="' +
      escapeHtml(item.brandZh + " " + item.nameZh) + ' 正装实拍图" decoding="async" />'
    );
  }

  function renderDeck() {
    deckEl.innerHTML = CATALOG.map(function (item, idx) {
      var r = getReview(item.id);
      var idxLabel = padIndex(item.index);
      var tab = activeTabs[item.id] || "notes";
      var isStamped = r.buyIntent === "must_buy";
      var score = r.overallScore;

      var tagsHtml = (item.reputationTags || [])
        .map(function (t) {
          return '<span class="rep-tag">' + escapeHtml(t) + "</span>";
        })
        .join("");

      var subdimsHtml = SUB_DIMENSIONS.map(function (dim) {
        var optsHtml = dim.options
          .map(function (opt) {
            var active = r[dim.key] === opt;
            return (
              '<button type="button" class="dim-chip' + (active ? " is-active" : "") + '" ' +
              'data-dim-id="' + item.id + '" data-dim-key="' + dim.key + '" data-dim-val="' + escapeHtml(opt) + '" ' +
              'aria-pressed="' + (active ? "true" : "false") + '">' +
              escapeHtml(opt) +
              "</button>"
            );
          })
          .join("");
        return (
          '<div class="subdim-row">' +
            '<span class="subdim-label">' + escapeHtml(dim.label) + "</span>" +
            '<div class="subdim-opts" role="group" aria-label="' + escapeHtml(dim.label) + '">' + optsHtml + "</div>" +
          "</div>"
        );
      }).join("");

      var dotsHtml = CATALOG.map(function (it, dIdx) {
        var dr = getReview(it.id);
        var cls = "pager-dot" + (dIdx === idx ? " is-active" : "") + (isItemTested(dr) ? " is-tested" : "");
        return '<button type="button" class="' + cls + '" data-jump="' + dIdx + '" aria-label="第 ' + (dIdx + 1) + ' 支"></button>';
      }).join("");

      return (
        '<article class="slide" data-index="' + idx + '" data-id="' + item.id + '">' +
          '<div class="label-sheet" style="--scent-color:' + item.palette.primary + '">' +
            '<span class="label-edge" aria-hidden="true"></span>' +

            '<div class="label-head">' +
              "<div>" +
                '<div class="label-num tabular">N°' + idxLabel + "<span>/ 10</span></div>" +
                '<div class="label-brand">' + escapeHtml(item.brandZh + " · " + item.brandEn.toUpperCase()) + "</div>" +
                '<h2 class="label-title">' + escapeHtml(item.nameZh) + "</h2>" +
                '<div class="label-en">' + escapeHtml(item.nameEn) + "</div>" +
                '<div class="rep-tags">' + tagsHtml + "</div>" +
              "</div>" +
              '<div class="bottle-stage">' +
                renderBottleImg(item, "bottle-photo") +
                '<div class="vermilion-seal' + (isStamped ? " is-stamped" : "") + '" data-seal aria-hidden="true">' +
                  '<div class="vermilion-seal-inner"><span>正装锁定</span><small>FLACON</small></div>' +
                "</div>" +
              "</div>" +
            "</div>" +

            '<p class="poetic-line">“' + escapeHtml(item.poetic) + '”</p>' +

            '<div class="prescription-block">' +
              '<div class="clip-tabs-wrap" data-tab="' + tab + '" data-tab-id="' + item.id + '">' +
                '<div class="clip-tabs-base">' +
                  '<button type="button" class="clip-tab-btn" data-switch-tab="notes">气味配方</button>' +
                  '<button type="button" class="clip-tab-btn" data-switch-tab="usage">穿香处方</button>' +
                "</div>" +
                '<div class="clip-tabs-active-layer" aria-hidden="true">' +
                  '<span class="clip-tab-mirror">气味配方</span>' +
                  '<span class="clip-tab-mirror">穿香处方</span>' +
                "</div>" +
              "</div>" +
              '<div class="panel-swap-stage">' +
                '<div class="swap-panel' + (tab === "notes" ? " is-visible" : "") + '" data-panel="notes">' +
                  '<div class="info-row"><span class="info-key">前调</span><span class="info-val">' + escapeHtml(item.notes.top) + "</span></div>" +
                  '<div class="info-row"><span class="info-key">中调</span><span class="info-val">' + escapeHtml(item.notes.heart) + "</span></div>" +

  function updateCardScoreAndStamp(slide, id, r) {
    var score = r.overallScore;
    slide.querySelector("[data-score-val]").textContent = formatScore(score);
    slide.querySelector("[data-mood]").textContent = scoreMood(score);
    var bar = slide.querySelector("[data-hearts]");
    bar.innerHTML = renderHeartsHtml(id, score);
    bar.setAttribute("aria-valuenow", String(typeof score === "number" ? score : 0));

    var isStamped = r.buyIntent === "must_buy";
    slide.querySelector("[data-seal]").classList.toggle("is-stamped", isStamped);
    var btn = slide.querySelector("[data-stamp]");
    btn.classList.toggle("is-stamped", isStamped);

    btn.querySelector("span").textContent = isStamped ? "已盖章 · 正装心愿已锁定" : "盖章锁定 · 想要这瓶正装";
    btn.querySelector("svg").setAttribute("fill", isStamped ? "currentColor" : "none");
  }

  function bindHearts() {
    deckEl.querySelectorAll("[data-hearts]").forEach(function (bar) {
      var id = bar.getAttribute("data-hearts");
      var slide = bar.closest(".slide");

      function applyClientX(clientX) {
        var rect = bar.getBoundingClientRect();
        var ratio = Math.max(0.05, Math.min(1, (clientX - rect.left) / rect.width));
        var score = Math.max(1, Math.min(10, Math.ceil(ratio * 10)));
        var r = updateReview(id, { overallScore: score });
        updateCardScoreAndStamp(slide, id, r);
        syncHeader();
        syncDots(currentIndex);
      }

      var down = false;
      bar.addEventListener("pointerdown", function (e) {
        e.stopPropagation();
        down = true;
        if (bar.setPointerCapture) bar.setPointerCapture(e.pointerId);
        applyClientX(e.clientX);
      });
      bar.addEventListener("pointermove", function (e) {
        if (!down) return;
        e.stopPropagation();
        applyClientX(e.clientX);
      });
      bar.addEventListener("pointerup", function () {
        down = false;
      });
      bar.addEventListener("pointercancel", function () {
        down = false;
      });
    });
  }

  function jumpToSlide(idx) {

  function switchView(view) {

      deckEl.hidden = true;
      indexEl.hidden = false;

      deckEl.hidden = false;
      deckEl.scrollLeft = currentIndex * (deckEl.clientWidth || 390);

  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(function () {
        return fallbackCopy(text);
      });
    }
    return Promise.resolve(fallbackCopy(text));
  }

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
    } finally {
      document.body.removeChild(ta);
    }
  }

  function loadImageAsync(src) {
    return new Promise(function (resolve) {
      if (!src) return resolve(null);
      var img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = function () { resolve(null); };
      img.src = src;
    });
  }

  function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
    var chars = String(text || "").split("");
    var line = "";
    var lines = [];
    for (var i = 0; i < chars.length; i++) {
      var test = line + chars[i];
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = chars[i];
        if (lines.length >= maxLines) break;
      } else {
        line = test;
      }
    }
    if (line && lines.length < maxLines) lines.push(line);
    for (var j = 0; j < lines.length; j++) {
      ctx.fillText(lines[j], x, y + j * lineHeight);
    }
    return lines.length * lineHeight;
  }

  function exportSalonPosterPng() {
    var stats = computeStats();
    var width = 1080;
    var rowHeight = 148;
    var headerH = 260;
    var footerH = 84;
    var height = headerH + CATALOG.length * rowHeight + footerH;

    Promise.all(CATALOG.map(function (it) { return loadImageAsync(BOTTLE_IMAGES[it.id]); })).then(function (imgs) {
      var canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      var ctx = canvas.getContext("2d");

      // 未涂布棉纸底色 + 细线边框
      ctx.fillStyle = "#FCFCFA";
      ctx.fillRect(0, 0, width, height);
      ctx.strokeStyle = "#141413";
      ctx.lineWidth = 3;
      ctx.strokeRect(28, 28, width - 56, height - 56);

      // 头部标题与 KPI
      ctx.fillStyle = "#141413";
      ctx.font = "700 46px Georgia, serif";
      ctx.fillText("十支寻香签 · 试香战报", 64, 118);

      ctx.fillStyle = "#66635C";
      ctx.font = "24px sans-serif";
      ctx.fillText(
        "已试 " + stats.testedCount + " / 10 支   ·   均分 " + stats.avgText + "   ·   正装锁定 " + stats.mustBuyCount + " 瓶",
        64,
        172
      );

      ctx.strokeStyle = "#141413";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(64, 212);
      ctx.lineTo(width - 64, 212);
      ctx.stroke();

      // 10 支明细行
      CATALOG.forEach(function (item, idx) {
        var r = getReview(item.id);
        var topY = headerH + idx * rowHeight;
        var img = imgs[idx];

        // 右侧色条指示
        ctx.fillStyle = item.palette.primary;
        ctx.fillRect(width - 36, topY + 12, 6, rowHeight - 24);

        // 瓶身缩略图
        if (img) {
          var scale = Math.min(84 / img.width, 108 / img.height);
          var dw = img.width * scale;
          var dh = img.height * scale;
          ctx.drawImage(img, 64 + (84 - dw) / 2, topY + (rowHeight - dh) / 2, dw, dh);
        }

        // 品牌与香名
        var textX = 174;
        ctx.fillStyle = "#66635C";
        ctx.font = "600 18px monospace";
        ctx.fillText("N°" + padIndex(item.index) + "  " + item.brandZh.toUpperCase(), textX, topY + 36);

        ctx.fillStyle = "#141413";
        ctx.font = "700 28px Georgia, serif";
        ctx.fillText(item.nameZh, textX, topY + 72);

        // 细评短词与随手记
        var dims = [r.opening, r.drydown, r.longevity].filter(Boolean).join(" · ");
        var detailLine = dims || (item.reputationTags || []).join(" · ");
        if (r.note) detailLine += (detailLine ? "  |  " : "") + r.note;
        ctx.fillStyle = "#66635C";
        ctx.font = "20px sans-serif";
        wrapCanvasText(ctx, detailLine, textX, topY + 106, 590, 26, 1);

        // 右侧评分与正装印章
        ctx.textAlign = "right";
        ctx.fillStyle = typeof r.overallScore === "number" ? "#9E2A2B" : "#9B978E";
        ctx.font = "700 34px Georgia, serif";
        ctx.fillText(
          typeof r.overallScore === "number" ? formatScore(r.overallScore) + " / 10" : "待试",
          width - 64,
          topY + 62
        );

        if (r.buyIntent === "must_buy") {
          ctx.strokeStyle = "#9E2A2B";
          ctx.lineWidth = 2;
          ctx.strokeRect(width - 178, topY + 78, 114, 34);
          ctx.fillStyle = "#9E2A2B";
          ctx.font = "700 18px Georgia, serif";
          ctx.fillText("正装锁定", width - 78, topY + 102);
        }
        ctx.textAlign = "left";

        // 底部分隔线
        ctx.strokeStyle = "#E5E3DD";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(64, topY + rowHeight - 2);
        ctx.lineTo(width - 64, topY + rowHeight - 2);
        ctx.stroke();
      });

      ctx.fillStyle = "#9B978E";
      ctx.font = "18px monospace";
      ctx.fillText("十支寻香签 · 沙龙试香手账记录导出", 64, height - 48);

      var pngUrl = canvas.toDataURL("image/png");
      renderSheet(pngUrl);
      var a = document.createElement("a");
      a.href = pngUrl;
      a.download = "十支寻香签试香战报.png";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast("高清手账长图已生成");
    });
  }

      return;
    }

    var dimBtn = e.target.closest("[data-dim-key]");
    if (dimBtn) {
      var dId = dimBtn.getAttribute("data-dim-id");
      var dKey = dimBtn.getAttribute("data-dim-key");
      var dVal = dimBtn.getAttribute("data-dim-val");
      var cur = getReview(dId);
      var nextVal = cur[dKey] === dVal ? null : dVal;

      patch[dKey] = nextVal;
      updateReview(dId, patch);
      var group = dimBtn.closest(".subdim-opts");

        var on = btn.getAttribute("data-dim-val") === nextVal;

        btn.setAttribute("aria-pressed", on ? "true" : "false");

      syncHeader();
      syncDots(currentIndex);
      return;
    }

    var stampBtn = e.target.closest("[data-stamp]");
    if (stampBtn) {
      var sId = stampBtn.getAttribute("data-stamp");
      var sCur = getReview(sId);
      var nextIntent = sCur.buyIntent === "must_buy" ? null : "must_buy";
      var sr = updateReview(sId, { buyIntent: nextIntent });
      updateCardScoreAndStamp(stampBtn.closest(".slide"), sId, sr);

      showToast(nextIntent === "must_buy" ? "已盖章锁定！加入正装心愿单" : "已取消这瓶正装印章");

    var stepBtn = e.target.closest("[data-step]");
    if (stepBtn) {
      jumpToSlide(currentIndex + Number(stepBtn.getAttribute("data-step")));
      return;

    var jumpDot = e.target.closest("[data-jump]");

  document.getElementById("import-json-input").addEventListener("change", function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(String(reader.result || "{}"));
        if (parsed && typeof parsed === "object" && parsed.reviews) {
          state = parsed;
          saveState();
          renderDeck();
          if (!indexEl.hidden) renderIndex();
          syncHeader();
          renderSheet(null);
          showToast("已成功恢复试香记录");
        } else {
          showToast("备份文件格式不正确");
        }
      } catch (err) {
        showToast("读取备份文件失败");
      }
      e.target.value = "";
    };
    reader.readAsText(file, "utf-8");
  });

  document.getElementById("ask-reset-btn").addEventListener("click", function () {
    resetStripEl.hidden = false;
  });

  document.getElementById("cancel-reset-btn").addEventListener("click", function () {
    resetStripEl.hidden = true;
  });

  document.getElementById("confirm-reset-btn").addEventListener("click", function () {
    state = { schemaVersion: "2.0.0", updatedAt: new Date().toISOString(), reviews: {} };
    saveState();
    resetStripEl.hidden = true;
    renderDeck();
    if (!indexEl.hidden) renderIndex();
    syncHeader();
    renderSheet(null);
    showToast("已清空全部记录");
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && sheetEl.classList.contains("is-open")) {
      closeSheet();
    }
  });

  renderDeck();
  syncHeader();
})();

  </script>
</body>
</html>
